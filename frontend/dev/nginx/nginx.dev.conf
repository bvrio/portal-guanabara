# Local DEV routing for Portal Guanabara.
#
# Product Identity is public-facing and may differ by persona.
#
# Local application ports:
#   clients-webapp      -> 3000
#   partners-webapp     -> 3001   (planned)
#   backoffice-webapp   -> 3002   (planned)
#
# This file is intentionally the single local routing definition for DEV.

worker_processes 1;

pid /tmp/portal-guanabara-nginx.pid;
error_log /tmp/portal-guanabara-nginx.error.log;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/portal-guanabara-nginx.access.log;

    # WebSocket upgrade only when the client asks for it (Vite HMR).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream clients_webapp {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name portalguanabara.dev.com.br;

        location / {
            proxy_pass http://clients_webapp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # --- Planned Apps: uncomment when they are bootstrapped. ---------------
    #
    # upstream partners_webapp   { server 127.0.0.1:3001; }
    # upstream backoffice_webapp { server 127.0.0.1:3002; }
    #
    # server {
    #     listen 80;
    #     server_name portalguanabara.parceiros.dev.com.br;
    #     location / { proxy_pass http://partners_webapp; ... same headers ... }
    # }
    #
    # server {
    #     listen 80;
    #     server_name portalguanabara.operacao.dev.com.br;
    #     location / { proxy_pass http://backoffice_webapp; ... same headers ... }
    # }
}
